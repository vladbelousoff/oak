<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oak Playground</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 14px;
      -webkit-text-size-adjust: 100%;
    }

    header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      padding: 10px 16px;
      background: #181825;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #cba6f7;
      letter-spacing: 0.5px;
    }

    #run-btn {
      margin-left: auto;
      padding: 5px 16px;
      background: #cba6f7;
      color: #1e1e2e;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    #run-btn:hover { background: #d0bcff; }
    #run-btn:disabled { background: #585b70; color: #6c7086; cursor: default; }

    #status {
      font-size: 12px;
      color: #6c7086;
    }

    .workspace {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .file-tree {
      display: flex;
      flex-direction: column;
      width: 280px;
      min-width: 220px;
      background: #181825;
      border-right: 1px solid #313244;
      overflow: hidden;
      flex-shrink: 0;
    }

    #examples-tree {
      flex: 1;
      overflow: auto;
      padding: 8px;
    }

    .tree-list {
      list-style: none;
    }

    .tree-list .tree-list {
      margin-left: 14px;
    }

    .tree-dir {
      margin: 2px 0;
    }

    .tree-dir summary {
      color: #bac2de;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      user-select: none;
    }

    .tree-dir summary:hover {
      background: #313244;
    }

    .tree-file {
      margin: 2px 0;
    }

    .tree-file button,
    .tree-file span {
      display: block;
      width: 100%;
      min-height: 26px;
      padding: 4px 6px;
      overflow: hidden;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
    }

    .tree-file button {
      color: #cdd6f4;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .tree-file button:hover {
      background: #313244;
    }

    .tree-file button.active {
      background: #45475a;
      color: #f5e0dc;
    }

    .tree-file span {
      color: #6c7086;
    }

    .panels {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .panel + .panel {
      border-left: 1px solid #313244;
    }

    .panel-label {
      padding: 6px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6c7086;
      background: #181825;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }

    #editor {
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    #output {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }

    .out-line { color: #cdd6f4; }
    .err-line { color: #f38ba8; }
    .placeholder { color: #45475a; font-style: italic; }

    @media (max-width: 720px) {
      body { font-size: 13px; }

      header {
        padding: 8px 10px;
        gap: 6px 8px;
      }

      header h1 {
        font-size: 14px;
        flex-basis: 100%;
      }

      #status {
        flex: 1;
        min-width: 0;
        text-align: right;
      }

      #run-btn {
        margin-left: 0;
        padding: 8px 18px;
        font-size: 13px;
      }

      .workspace {
        flex-direction: column;
      }

      .file-tree {
        width: 100%;
        min-width: 0;
        height: 180px;
        border-right: none;
        border-bottom: 1px solid #313244;
      }

      .panels {
        flex-direction: column;
      }

      .panel {
        flex: 1 1 0;
        min-height: 0;
      }

      .panel + .panel {
        border-left: none;
        border-top: 1px solid #313244;
      }

      #editor .cm-scroller { font-size: 13px !important; }
      #editor .cm-content  { padding: 12px !important; }
      #output { padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Oak Playground</h1>
    <span id="status">Loading...</span>
    <button id="run-btn" disabled>Run</button>
  </header>
  <div class="workspace">
    <aside class="file-tree">
      <div class="panel-label">Examples</div>
      <nav id="examples-tree" aria-label="Examples"></nav>
    </aside>
    <div class="panels">
      <div class="panel">
        <div class="panel-label">Input</div>
        <div id="editor"></div>
      </div>
      <div class="panel">
        <div class="panel-label">Output</div>
        <div id="output"><span class="placeholder">Output will appear here.</span></div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const originalDecode = TextDecoder.prototype.decode;

      // Older Emscripten glue can pass views backed by resizable wasm memory.
      function fixedLengthCopy(input) {
        if (input instanceof ArrayBuffer) {
          return new Uint8Array(input).slice(0);
        }
        if (ArrayBuffer.isView(input)) {
          return new Uint8Array(input.buffer, input.byteOffset, input.byteLength).slice(0);
        }
        return input;
      }

      TextDecoder.prototype.decode = function decode(input, options) {
        if (input?.resizable || input?.buffer?.resizable) {
          return originalDecode.call(this, fixedLengthCopy(input), options);
        }
        return originalDecode.call(this, input, options);
      };
    })();
  </script>
  <script src="/build_wasm/oak_wasm.js?v=examples-tree-fs-v2"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

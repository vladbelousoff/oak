<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oak Playground</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 14px;
      -webkit-text-size-adjust: 100%;
    }

    header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      padding: 10px 16px;
      background: #181825;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #cba6f7;
      letter-spacing: 0.5px;
    }

    #examples-select {
      margin-left: auto;
      padding: 5px 10px;
      background: #313244;
      color: #cdd6f4;
      border: 1px solid #45475a;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    #examples-select:hover { border-color: #cba6f7; }
    #examples-select option { background: #181825; }

    #run-btn {
      padding: 5px 16px;
      background: #cba6f7;
      color: #1e1e2e;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    #run-btn:hover { background: #d0bcff; }
    #run-btn:disabled { background: #585b70; color: #6c7086; cursor: default; }

    #status {
      font-size: 12px;
      color: #6c7086;
    }

    .panels {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .panel + .panel {
      border-left: 1px solid #313244;
    }

    .panel-label {
      padding: 6px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6c7086;
      background: #181825;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }

    .editor-wrapper {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    #line-numbers {
      padding: 16px 10px 16px 12px;
      min-width: 48px;
      text-align: right;
      color: #45475a;
      background: #181825;
      border-right: 1px solid #313244;
      user-select: none;
      overflow: hidden;
      line-height: 1.6;
      font-size: 14px;
      font-family: inherit;
      white-space: pre;
      flex-shrink: 0;
    }

    #editor {
      flex: 1;
      background: #1e1e2e;
      color: #cdd6f4;
      border: none;
      outline: none;
      resize: none;
      padding: 16px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.6;
      tab-size: 2;
      overflow-y: scroll;
    }

    #output {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }

    .out-line { color: #cdd6f4; }
    .err-line { color: #f38ba8; }
    .placeholder { color: #45475a; font-style: italic; }

    @media (max-width: 720px) {
      body { font-size: 13px; }

      header {
        padding: 8px 10px;
        gap: 6px 8px;
      }

      header h1 {
        font-size: 14px;
        flex-basis: 100%;
      }

      #status {
        order: 3;
        flex-basis: 100%;
        margin-top: 2px;
      }

      #examples-select {
        margin-left: 0;
        flex: 1;
        min-width: 0;
        padding: 8px 10px;
        font-size: 13px;
      }

      #run-btn {
        padding: 8px 18px;
        font-size: 13px;
      }

      .panels {
        flex-direction: column;
      }

      .panel {
        flex: 1 1 0;
        min-height: 0;
      }

      .panel + .panel {
        border-left: none;
        border-top: 1px solid #313244;
      }

      #line-numbers {
        padding: 12px 8px 12px 10px;
        min-width: 36px;
        font-size: 13px;
      }

      #editor {
        padding: 12px;
        font-size: 13px;
      }

      #output {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Oak Playground</h1>
    <span id="status">Loading...</span>
    <select id="examples-select" title="Load an example">
      <option value="">Examples…</option>
      <optgroup label="Basics">
        <option value="hello">Hello World</option>
        <option value="variables">Variables &amp; Operators</option>
        <option value="strings">Strings &amp; Formatting</option>
      </optgroup>
      <optgroup label="Control Flow">
        <option value="control_flow">If / For / While</option>
        <option value="break_continue">Break &amp; Continue</option>
      </optgroup>
      <optgroup label="Functions">
        <option value="functions">Functions</option>
        <option value="recursion">Recursion</option>
        <option value="mutual_recursion">Mutual Recursion</option>
      </optgroup>
      <optgroup label="Collections">
        <option value="arrays">Arrays</option>
        <option value="maps">Maps</option>
      </optgroup>
      <optgroup label="Records">
        <option value="records">Records &amp; Methods</option>
      </optgroup>
      <optgroup label="Algorithms">
        <option value="fizzbuzz">FizzBuzz</option>
        <option value="fibonacci">Fibonacci</option>
        <option value="primes">Primes</option>
        <option value="collatz">Collatz Sequence</option>
        <option value="bubble_sort">Bubble Sort</option>
      </optgroup>
    </select>
    <button id="run-btn" disabled>Run</button>
  </header>
  <div class="panels">
    <div class="panel">
      <div class="panel-label">Input</div>
      <div class="editor-wrapper">
        <div id="line-numbers" aria-hidden="true">1</div>
        <textarea id="editor" spellcheck="false" placeholder="Write Oak code here..."></textarea>
      </div>
    </div>
    <div class="panel">
      <div class="panel-label">Output</div>
      <div id="output"><span class="placeholder">Output will appear here.</span></div>
    </div>
  </div>

  <script src="../build_wasm/oak_wasm.js"></script>
  <script>
    const editor      = document.getElementById('editor');
    const output      = document.getElementById('output');
    const runBtn      = document.getElementById('run-btn');
    const status      = document.getElementById('status');
    const lineNumbers = document.getElementById('line-numbers');

    let oakRun  = null;
    let captured = [];

    // ── Line numbers ─────────────────────────────────────────────────────────
    function updateLineNumbers() {
      const count = (editor.value.match(/\n/g) || []).length + 1;
      let text = '';
      for (let i = 1; i <= count; i++) text += i + '\n';
      lineNumbers.textContent = text;
      lineNumbers.scrollTop = editor.scrollTop;
    }

    editor.addEventListener('input',  updateLineNumbers);
    editor.addEventListener('scroll', () => { lineNumbers.scrollTop = editor.scrollTop; });
    updateLineNumbers();

    // ── WASM ──────────────────────────────────────────────────────────────────
    function appendOutput(text, isErr) {
      const line = document.createElement('span');
      line.className = isErr ? 'err-line' : 'out-line';
      line.textContent = text + '\n';
      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    OakModule({
      print:    (text) => { if (oakRun) captured.push({ text, err: false }); },
      printErr: (text) => { if (oakRun) captured.push({ text, err: true }); },
    }).then(module => {
      oakRun = module.cwrap('oak_run_wrapper', 'number', ['string']);
      runBtn.disabled = false;
      status.textContent = 'Ready';
    }).catch(err => {
      status.textContent = 'Failed to load';
      appendOutput('Failed to load WASM module: ' + err, true);
    });

    function run() {
      if (!oakRun) return;

      output.innerHTML = '';
      captured = [];

      const code = editor.value;
      let exitCode;
      try {
        exitCode = oakRun(code);
      } catch (e) {
        appendOutput('Runtime exception: ' + e, true);
        return;
      }

      for (const { text, err } of captured) {
        appendOutput(text, err);
      }

      if (output.children.length === 0) {
        const ph = document.createElement('span');
        ph.className = 'placeholder';
        ph.textContent = exitCode === 0 ? 'Finished with no output.' : `Exited with code ${exitCode}.`;
        output.appendChild(ph);
      }
    }

    // ── Examples ──────────────────────────────────────────────────────────────
    const EXAMPLES = {

      hello:
`print('Hello, World!');
print(42);
print(3.14);
print(true);
print(false);`,

      variables:
`let x = 42;
let pi = 3.14;
let flag = true;

let mut n = 10;
n = 20;
n += 5;
n -= 3;
n *= 2;
n /= 4;
n %= 7;
print(n);

print(x > 0 && flag);
print(x == 0 || n != 0);
print(!false);
print(-x + 100);`,

      strings:
`let greeting = 'Hello';
let name = 'Oak';
print(greeting + ', ' + name + '!');

let escaped = 'line one\nline two';
print(escaped);

let vals = [3, 4, 7];
print('{0} + {1} = {2}'.format(vals));

let parts = ['foo', 'bar', 'baz'];
print('{}{}{}'.format(parts));

print('{{literal braces}}'.format([] as string[]));

let word = 'hello';
print(word.size());`,

      control_flow:
`let x = 7;

if x > 10 {
  print('big');
} else {
  if x > 4 {
    print('medium');
  } else {
    print('small');
  }
}

for i from 0 to 5 {
  print(i);
}

let mut sum = 0;
for i from 1 to 101 {
  sum += i;
}
print(sum);

let mut i = 0;
while i < 5 {
  print(i);
  i += 1;
}`,

      break_continue:
`for i from 0 to 10 {
  if i == 5 {
    break;
  }
  print(i);
}

let mut odds = 0;
for i from 0 to 20 {
  if i % 2 == 0 {
    continue;
  }
  odds += 1;
}
print(odds);

let mut n = 0;
while true {
  if n == 7 {
    break;
  }
  n += 1;
}
print(n);`,

      functions:
`fn add(a : number, b : number) -> number {
  return a + b;
}

fn max(a : number, b : number) -> number {
  if a > b {
    return a;
  }
  return b;
}

fn greet(name : string) -> string {
  return 'Hello, ' + name + '!';
}

fn abs(x : number) -> number {
  if x < 0 {
    return -x;
  }
  return x;
}

print(add(3, 4));
print(max(10, 20));
print(greet('Oak'));
print(abs(-42));`,

      recursion:
`fn fact(n : number) -> number {
  if n <= 1 {
    return 1;
  }
  return n * fact(n - 1);
}

fn power(base : number, exp : number) -> number {
  if exp == 0 {
    return 1;
  }
  return base * power(base, exp - 1);
}

for i from 0 to 8 {
  print(fact(i));
}

print(power(2, 10));`,

      mutual_recursion:
`fn is_even(n : number) -> number {
  if n == 0 {
    return 1;
  }
  return is_odd(n - 1);
}

fn is_odd(n : number) -> number {
  if n == 0 {
    return 0;
  }
  return is_even(n - 1);
}

for i from 0 to 8 {
  print(is_even(i));
}`,

      arrays:
`let mut nums = [] as number[];
nums.push(10);
nums.push(20);
nums.push(30);
nums.push(40);

print(nums.size());

nums[0] = 99;
print(nums[0]);
print(nums[nums.size() - 1]);

let mut total = 0;
for v in nums {
  total += v;
}
print(total);

for i, v in nums {
  print(i);
  print(v);
}

let words = ['oak', 'is', 'fun'];
for w in words {
  print(w);
}`,

      maps:
`let mut scores = [:] as [string:number];
scores['alice'] = 95;
scores['bob']   = 87;
scores['carol'] = 92;

print(scores.size());
print(scores['alice']);

print(scores.has('bob'));
print(scores.has('dave'));

scores.delete('bob');
print(scores.size());

let mut total = 0;
for k, v in scores {
  print(k);
  total += v;
}
print(total);

let by_id = [1: 'alpha', 2: 'beta', 3: 'gamma'];
print(by_id[2]);
print(by_id.size());`,

      records:
`record Point {
  x : number;
  y : number;

  fn dist_sq(self, other : Point) -> number {
    let dx = self.x - other.x;
    let dy = self.y - other.y;
    return dx * dx + dy * dy;
  }

  fn translate(mut self, dx : number, dy : number) {
    self.x = self.x + dx;
    self.y = self.y + dy;
  }

  fn origin() -> Point {
    return new Point { x : 0, y : 0 };
  }
}

record Person {
  name : string;
  age  : number;

  fn greet(self) -> string {
    return 'Hi, I am ' + self.name;
  }
}

let a = new Point { x : 3, y : 4 };
let b = Point.origin();
print(a.dist_sq(b));

let mut p = new Point { x : 1, y : 1 };
p.translate(2, 3);
print(p.x);
print(p.y);

let alice = new Person { name : 'alice', age : 30 };
print(alice.greet());
print(alice.age);`,

      fizzbuzz:
`for i from 1 to 31 {
  if i % 15 == 0 {
    print('fizzbuzz');
  } else {
    if i % 3 == 0 {
      print('fizz');
    } else {
      if i % 5 == 0 {
        print('buzz');
      } else {
        print(i);
      }
    }
  }
}`,

      fibonacci:
`let mut a = 0;
let mut b = 1;

for i from 0 to 20 {
  print(a);
  let mut tmp = a + b;
  a = b;
  b = tmp;
}`,

      primes:
`for n from 2 to 50 {
  let mut is_prime = 1;
  for i from 2 to n {
    if n % i == 0 {
      is_prime = 0;
    }
  }
  if is_prime == 1 {
    print(n);
  }
}`,

      collatz:
`let mut n = 27;
let mut steps = 0;

while n != 1 {
  print(n);
  if n % 2 == 0 {
    n /= 2;
  } else {
    n *= 3;
    n += 1;
  }
  steps += 1;
}

print(n);
print(steps);`,

      bubble_sort:
`fn swap(mut arr: number[], i: number, j: number) {
  let tmp = arr[i];
  arr[i] = arr[j];
  arr[j] = tmp;
}

fn bubble_sort(mut arr: number[]) -> number {
  let n = arr.size();
  let mut i = 0;
  while i < n {
    let mut j = 0;
    while j < n - i - 1 {
      if arr[j] > arr[j + 1] {
        swap(arr, j, j + 1);
      }
      j += 1;
    }
    i += 1;
  }
  return n;
}

let mut data = [5, 2, 9, 1, 7, 3, 8, 4, 6, 0];
bubble_sort(data);
for v in data {
  print(v);
}`,

    };

    const examplesSelect = document.getElementById('examples-select');
    examplesSelect.addEventListener('change', () => {
      const key = examplesSelect.value;
      if (key && EXAMPLES[key]) {
        editor.value = EXAMPLES[key];
        updateLineNumbers();
        editor.focus();
      }
      examplesSelect.value = '';
    });

    runBtn.addEventListener('click', run);

    editor.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        run();
      }
      if (e.key === 'Tab') {
        e.preventDefault();
        const { selectionStart: s, selectionEnd: e2, value: v } = editor;
        editor.value = v.slice(0, s) + '  ' + v.slice(e2);
        editor.selectionStart = editor.selectionEnd = s + 2;
        updateLineNumbers();
      }
    });
  </script>
</body>
</html>

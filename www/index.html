<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oak Playground</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 14px;
      -webkit-text-size-adjust: 100%;
    }

    header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      padding: 10px 16px;
      background: #181825;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #cba6f7;
      letter-spacing: 0.5px;
    }

    #examples-select {
      margin-left: auto;
      padding: 5px 10px;
      background: #313244;
      color: #cdd6f4;
      border: 1px solid #45475a;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    #examples-select:hover { border-color: #cba6f7; }
    #examples-select option { background: #181825; }

    #run-btn {
      padding: 5px 16px;
      background: #cba6f7;
      color: #1e1e2e;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    #run-btn:hover { background: #d0bcff; }
    #run-btn:disabled { background: #585b70; color: #6c7086; cursor: default; }

    #status {
      font-size: 12px;
      color: #6c7086;
    }

    .panels {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .panel + .panel {
      border-left: 1px solid #313244;
    }

    .panel-label {
      padding: 6px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6c7086;
      background: #181825;
      border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }

    #editor {
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    #output {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }

    .out-line { color: #cdd6f4; }
    .err-line { color: #f38ba8; }
    .placeholder { color: #45475a; font-style: italic; }

    @media (max-width: 720px) {
      body { font-size: 13px; }

      header {
        padding: 8px 10px;
        gap: 6px 8px;
      }

      header h1 {
        font-size: 14px;
        flex-basis: 100%;
      }

      #status {
        order: 3;
        flex-basis: 100%;
        margin-top: 2px;
      }

      #examples-select {
        margin-left: 0;
        flex: 1;
        min-width: 0;
        padding: 8px 10px;
        font-size: 13px;
      }

      #run-btn {
        padding: 8px 18px;
        font-size: 13px;
      }

      .panels {
        flex-direction: column;
      }

      .panel {
        flex: 1 1 0;
        min-height: 0;
      }

      .panel + .panel {
        border-left: none;
        border-top: 1px solid #313244;
      }

      #editor .cm-scroller { font-size: 13px !important; }
      #editor .cm-content  { padding: 12px !important; }
      #output { padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Oak Playground</h1>
    <span id="status">Loading...</span>
    <select id="examples-select" title="Load an example">
      <option value="">Examples…</option>
      <optgroup label="Basics">
        <option value="hello">Hello World</option>
        <option value="variables">Variables &amp; Operators</option>
        <option value="strings">Strings &amp; Formatting</option>
      </optgroup>
      <optgroup label="Control Flow">
        <option value="control_flow">If / For / While</option>
        <option value="break_continue">Break &amp; Continue</option>
      </optgroup>
      <optgroup label="Functions">
        <option value="functions">Functions</option>
        <option value="recursion">Recursion</option>
        <option value="mutual_recursion">Mutual Recursion</option>
      </optgroup>
      <optgroup label="Collections">
        <option value="arrays">Arrays</option>
        <option value="maps">Maps</option>
      </optgroup>
      <optgroup label="Records">
        <option value="records">Records &amp; Methods</option>
      </optgroup>
      <optgroup label="Algorithms">
        <option value="fizzbuzz">FizzBuzz</option>
        <option value="fibonacci">Fibonacci</option>
        <option value="primes">Primes</option>
        <option value="collatz">Collatz Sequence</option>
        <option value="bubble_sort">Bubble Sort</option>
      </optgroup>
    </select>
    <button id="run-btn" disabled>Run</button>
  </header>
  <div class="panels">
    <div class="panel">
      <div class="panel-label">Input</div>
      <div id="editor"></div>
    </div>
    <div class="panel">
      <div class="panel-label">Output</div>
      <div id="output"><span class="placeholder">Output will appear here.</span></div>
    </div>
  </div>

  <script src="/build_wasm/oak_wasm.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>

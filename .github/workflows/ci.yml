name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: windows-latest
            cc: cl

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Meson
        run: python -m pip install meson ninja

      # The public headers must not depend on how the library was built: a
      # consumer never passes -DOAK_*, so anything keying on one is either an
      # ABI trap or a silent behaviour change. OAK_BUILDING_ACORN/OAK_STATIC in
      # oak_export.h are the deliberate exceptions (dllimport/dllexport).
      # The public_api test target covers the include-path half of this.
      - name: Check no build defines leak into public headers
        if: runner.os == 'Linux'
        run: |
          if grep -rn 'OAK_TRACK_MEMORY\|OAK_DEBUG_LOGGING\|OAK_ATOMIC_REFCOUNT' include/ --include='*.h' | grep -v '^\S*:\s*[0-9]*:\s*\*'; then
            echo "::error::a build define is referenced in a public header"; exit 1
          fi
          if grep -rn 'defined(OAK_' include/ --include='*.h' | grep -v 'oak_export.h'; then
            echo "::error::unexpected OAK_* conditional outside oak_export.h"; exit 1
          fi

      # A header in include/ that is missing from oak_public_headers compiles
      # in-tree but never gets installed, so consumers fail only after packaging.
      - name: Check every public header is installed
        if: runner.os == 'Linux'
        run: |
          sed -n '/^oak_public_headers = files(/,/^)/p' meson.build \
            | sed -n "s|.*'include/\([^']*\)'.*|\1|p" | sort > /tmp/listed
          ls include/ | sort > /tmp/actual
          if ! diff -u /tmp/listed /tmp/actual; then
            echo "::error::include/ and oak_public_headers in meson.build disagree"; exit 1
          fi

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: CC=${{ matrix.cc }} meson setup build --buildtype=debug

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: meson setup build --buildtype=debug --vsenv

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Meson
        run: python -m pip install meson ninja

      - name: Configure WASM
        run: meson setup build_wasm --cross-file meson/cross/emscripten.ini --buildtype=release

      - name: Build WASM
        run: meson compile -C build_wasm oak_wasm.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage WASM into Vite public dir
        run: |
          mkdir -p www/public/build_wasm
          cp build_wasm/oak_wasm.js www/public/build_wasm/
          cp build_wasm/oak_wasm.wasm www/public/build_wasm/

      - name: Install JS deps and build
        run: npm ci && npm run build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'stdlib/**'
      - 'benchmark/**'
      - 'meson.build'
      - 'meson_options.txt'
      - 'oak.c'
      - 'oak_cli.c'
      - 'oak_cli.h'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  contents: write

# Never run two benchmark jobs at once: the later one would commit a README
# based on the earlier one's code. Queue instead of cancel.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Meson
        run: python -m pip install meson ninja

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install benchmark runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luajit ruby mono-mcs mono-runtime hyperfine

      - name: Build Oak (release)
        run: |
          meson setup build-release -Dbuildtype=release
          meson compile -C build-release

      - name: Run benchmarks
        run: ./benchmark/run.py --warmup 5 --min-runs 10

      - name: Publish results to job summary
        run: cat benchmark/results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark/results/

      - name: Update README
        run: python3 benchmark/update_readme.py

      - name: Commit updated README
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update benchmark results [skip ci]"
          # main may have moved while benchmarks ran
          git pull --rebase origin main
          git push origin main
